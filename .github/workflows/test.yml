# Test contract: the suite is node:test (Node stdlib) — zero dependencies,
# nothing to install. Node pinned to 22 (matches the development host).
# Runner pinned to ubuntu-24.04 (ubuntu-latest moves to Ubuntu 26 on
# 2026-10-19 — the environment must not drift under the contract).
# Actions pinned by full commit SHA (tag-resolved), not by mutable tag.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Run test suite (node --test, zero deps)
        run: node --test tests/*.test.js
